apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-ok
  namespace: test
  annotations:
    curfew/sleep: "0 20 * * 1-5"  # Scale down Mon-Fri at 8pm
    curfew/wake: "0 8 * * 1-5"  # Scale back up Mon-Fri at 8am
    curfew/timezone: "Europe/Paris"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
