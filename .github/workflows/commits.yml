name: Commits

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check commit titles
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|build|ci|docs|test|style|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ]'
          bad=0
          while IFS=' ' read -r sha subject; do
            if printf '%s\n' "$subject" | grep -Eq "$pattern"; then
              echo "ok   $sha $subject"
            else
              echo "::error title=Not a conventional commit::$sha $subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          if [ "$bad" -ne 0 ]; then
            echo "Commit titles must be: type(scope)!: description"
            echo "Types: feat, fix, perf, refactor, build, ci, docs, test, style, chore, revert. Scope and ! are optional."
            exit 1
          fi
