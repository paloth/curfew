name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # No call: the action only installs the CLI, so the next step can keep the log for annotations
      - name: Install Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.11
      # lint, test, vuln, helm and docs in parallel: `just check` without the build, which the build job does
      - name: Check in Dagger
        # The report (stdout) goes to the job summary; on failure the log is turned into annotations too
        run: |
          set -o pipefail
          if { dagger --progress plain call check --version="$GITHUB_SHA" --build=false > "$RUNNER_TEMP/report.md"; } 2>&1 | tee "$RUNNER_TEMP/check.log"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/report.md"
          else
            .github/scripts/annotate-check.sh "$RUNNER_TEMP/check.log"
            exit 1
          fi

  # Each released platform on a runner of its own architecture, so nothing is cross-compiled or emulated
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the image in Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.11
          call: image --version=${{ github.sha }} --platform=linux/${{ matrix.arch }} sync

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    env:
      KUBE_CONTEXT: kind-curfew
      OPERATOR_NS: curfew
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.1
      - name: Create the kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
        with:
          cluster_name: curfew
      - name: Build the image in Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.11
          call: image --version=e2e export-image --name=ghcr.io/paloth/curfew:e2e
      - name: Load the image into kind
        run: kind load docker-image ghcr.io/paloth/curfew:e2e --name curfew
      - name: Deploy curfew
        run: |
          kubectl --context "$KUBE_CONTEXT" create namespace "$OPERATOR_NS"
          kubectl --context "$KUBE_CONTEXT" label namespace "$OPERATOR_NS" \
            pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/warn=restricted
          kubectl --context "$KUBE_CONTEXT" apply -f test/widget-crd.yaml
          helm upgrade --install curfew helm/ --kube-context "$KUBE_CONTEXT" -n "$OPERATOR_NS" \
            -f test/e2e-values.yaml --set image.tag=e2e --set image.pullPolicy=Never --set dev=true --wait --timeout 3m
      - name: Run the end-to-end test
        run: test/e2e.sh
      - name: Show operator logs
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" -n "$OPERATOR_NS" describe pods
          kubectl --context "$KUBE_CONTEXT" -n "$OPERATOR_NS" logs deployment/curfew --tail=200
