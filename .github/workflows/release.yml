name: Release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release now, even if the last release is less than 5 days old
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check 5 days since the last release
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          last=$(gh release list --limit 1 --json publishedAt --jq '.[0].publishedAt // empty')
          due=true
          if [ -n "$last" ] && [ "$FORCE" != "true" ]; then
            days=$(( ($(date +%s) - $(date -d "$last" +%s)) / 86400 ))
            echo "Last release: $last ($days day(s) ago)"
            if [ "$days" -lt 5 ]; then due=false; fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - name: Start at v1.0.0
        id: first
        if: steps.due.outputs.due == 'true'
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then echo "bump=major" >> "$GITHUB_OUTPUT"; fi
      - uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46
        id: version
        if: steps.due.outputs.due == 'true'
        with:
          github_token: ${{ github.token }}
          dry_run: true
          default_bump: false
          force_bump: ${{ steps.first.outputs.bump }}
          preset_config: >-
            {"types": [
              {"type": "feat", "section": "Features"},
              {"type": "fix", "section": "Bug Fixes"},
              {"type": "perf", "section": "Chores"},
              {"type": "refactor", "section": "Chores"},
              {"type": "build", "section": "Chores"},
              {"type": "ci", "section": "Chores"},
              {"type": "docs", "section": "Chores"},
              {"type": "test", "section": "Chores"},
              {"type": "style", "section": "Chores"},
              {"type": "chore", "section": "Chores"},
              {"type": "revert", "section": "Chores"}
            ]}
      - name: Release notes
        id: plan
        if: steps.version.outputs.new_tag != ''
        env:
          CHANGELOG: ${{ steps.version.outputs.changelog }}
          VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          printf '%s\n' "$CHANGELOG" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          { echo "release=true"; echo "version=$VERSION"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: release-notes.md

  ci:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [plan, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: echo "list=ghcr.io/paloth/curfew:${VERSION},ghcr.io/paloth/curfew:${VERSION%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.1
      - name: Package the chart at this version
        run: helm package helm/ --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/curfew-"$VERSION".tgz \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
