{{- if .Values.networkPolicy.enabled }}
# Ingress: only the health port (kubelet probes) and, when enabled, the metrics port. Egress: the API server, DNS, and the trace collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helm.fullname" . }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helm.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - port: 8080
          protocol: TCP
        {{- end }}
  egress:
    # The API server is reached by IP, so only ports can be pinned portably.
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.tracing.endpoint }}
    - ports:
        - port: {{ splitList ":" . | last | int }}
          protocol: TCP
    {{- end }}
{{- end }}
